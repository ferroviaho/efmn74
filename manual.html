<section class="manual-item" id="telhado-zinco">
  <h2>Como fazer telhado de zinco</h2>

  <p>
    Para fazer um telhado de zinco em escala HO, utilizei folhas de alumínio
    retiradas de pequenas embalagens descartáveis. O processo é simples,
    econômico e produz um resultado bastante realista.
  </p>

  <figure>
    <img src="Foto 1.JPG"
         alt="Embalagens de alumínio utilizadas para fazer o telhado de zinco"
         loading="lazy">
    <figcaption>
      Figura 1 — Utilize folhas de alumínio retiradas de pequenas embalagens
      descartáveis. Recorte uma parte lisa no tamanho aproximado do telhado
      que deseja construir.
    </figcaption>
  </figure>

  <figure>
    <img src="Foto 2.JPG"
         alt="Molde feito com palitos de madeira para formar as ondulações do telhado"
         loading="lazy">
    <figcaption>
      Figura 2 — Cole palitos de madeira paralelamente sobre uma base,
      mantendo aproximadamente a mesma distância entre eles. Este será o molde
      utilizado para formar os frisos do telhado.
    </figcaption>
  </figure>

  <figure>
    <img src="Foto 3.JPG"
         alt="Folha de alumínio sendo moldada sobre os palitos"
         loading="lazy">
    <figcaption>
      Figura 3 — Coloque sobre o molde de palitos uma folha de alumínio do
      tamanho desejado. Fixe uma das pontas com fita crepe. Com outro palito,
      faça um friso onde não há palito, moldando a folha de alumínio como se
      fosse um telhado de zinco.
    </figcaption>
  </figure>

  <figure>
    <img src="Foto 4.jpg"
         alt="Resultado da folha de alumínio já moldada com aspecto de telhado de zinco"
         loading="lazy">
    <figcaption>
      Figura 4 — Após concluir, cole o telhado em uma cartolina ou em outro
      compensado do tamanho do telhado. Se ficar grande, corte o que passar do
      limite. Se ficar pequeno, complete com outro pedaço de alumínio moldado.
      Pinte o telhado com uma mistura de tinta PVA na cor marrom-claro e água,
      em partes iguais (50% de cada). Depois de seco, passe betume da Judeia,
      tipo cera, em alguns pontos para imitar poeira e fuligem acumuladas.
    </figcaption>
  </figure>
</section>
