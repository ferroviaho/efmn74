<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cachoeira abaixo da escada caracol — Galeria da Ferrovia EFMN 74.">
  <title>Cachoeira abaixo da escada caracol — EFMN 74</title>

  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #222;
      --dark: #151515;
      --line: #ded7c8;
      --link: #0056b3;
      --max: 1100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    header {
      background: var(--dark);
      color: #fff;
    }

    .header-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 8px 20px 6px;
    }

    .header-identidade {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .header-logo {
      width: 72px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    .header-texto {
      text-align: left;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header-linha1,
    .header-linha2 {
      margin: 0;
    }

    .header-linha1 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .header-linha2 {
      margin-top: 2px;
      font-size: 0.88rem;
      color: #ddd;
    }

    .main-nav {
      margin-top: 7px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.93rem;
    }

    .main-nav a,
    .main-nav .ativo {
      display: inline-block;
      margin: 3px 10px;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
    }

    .main-nav a:hover,
    .main-nav a:focus {
      text-decoration: underline;
    }

    .main-nav .ativo {
      color: #aaa;
      cursor: default;
    }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 34px 20px 60px;
    }

    .voltar-galeria {
      margin: 0 0 18px;
    }

    .voltar-galeria a {
      color: var(--link);
      text-decoration: underline;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 22px;
      font-size: 2rem;
    }

    .galeria-foto {
      width: 100%;
      max-width: 820px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }

    figcaption {
      max-width: 820px;
      margin: 10px auto 0;
      color: #5f5a52;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      text-align: center;
    }

    @media (max-width: 700px) {
      .header-inner {
        padding: 8px 14px 7px;
      }

      .header-identidade {
        gap: 12px;
      }

      .header-logo {
        width: 62px;
      }

      .header-linha1 {
        font-size: 0.9rem;
      }

      .header-linha2 {
        font-size: 0.8rem;
      }

      .main-nav {
        margin-top: 6px;
        line-height: 1.5;
      }

      .main-nav a,
      .main-nav .ativo {
        margin: 2px 6px;
        font-size: 0.85rem;
      }

      main {
        padding: 26px 16px 44px;
      }

      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="header-identidade">
      <img
        src="logo-efmn74.PNG"
        alt="Logomarca da Ferrovia EFMN 74"
        class="header-logo"
      >

      <div class="header-texto">
        <p class="header-linha1">Ferrovia EFMN 74 - Escala HO</p>
        <p class="header-linha2">Construção, automação, memória e documentação</p>
      </div>
    </div>

    <nav class="main-nav" aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="diario-de-bordo.html">Diário de Bordo</a>
      <a href="documentacao.html">Documentação</a>
      <a href="manual-indice.html">Manual de Construção</a>
      <span class="ativo">Galeria</span>
      <a href="downloads.html">Downloads</a>
    </nav>

  </div>
</header>

<main>

  <p class="voltar-galeria">
    <a href="galeria-indice.html">← Voltar ao índice da Galeria</a>
  </p>

  <h1>Cachoeira abaixo da escada caracol</h1>

  <figure>
    <img
      src="cachoeira-caracol.jpg"
      alt="Cachoeira abaixo da escada caracol na maquete Ferrovia EFMN 74"
      class="galeria-foto"
    >
    <figcaption>
      Cachoeira integrada ao relevo rochoso e à vegetação do cenário da Ferrovia EFMN 74.
    </figcaption>
  </figure>

</main>

</body>
</html>
